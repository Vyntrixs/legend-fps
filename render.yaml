services:
  - type: web
    name: legend-fps-relay
    runtime: node
    plan: free
    region: frankfurt
    branch: cosmetics-foundation
    rootDir: legend-relay-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: LEGEND_RELAY_TOKEN
        generateValue: true
