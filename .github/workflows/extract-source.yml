name: Extract and build LEGEND FPS

on:
  workflow_dispatch:
  push:
    paths:
      - "LEGEND-FPS-2.1-SOURCE.zip"
      - ".github/workflows/extract-source.yml"

permissions:
  contents: read

jobs:
  extract-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Extract source
        run: |
          set -euo pipefail
          mkdir -p _unpack
          unzip -q -o LEGEND-FPS-2.1-SOURCE.zip -d _unpack
          first="$(find _unpack -mindepth 1 -maxdepth 1 -print -quit)"
          count="$(find _unpack -mindepth 1 -maxdepth 1 | wc -l)"
          if [ "$count" -eq 1 ] && [ -d "$first" ]; then cp -a "$first"/. .; else cp -a _unpack/. .; fi
          rm -rf _unpack
          # Apply Minecraft 1.21.11 source compatibility fixes after extracting the original ZIP.
          sed -i 's/import net.minecraft.client.ParticleStatus;/import net.minecraft.server.level.ParticleStatus;/' src/main/java/com/legendfps/PerformanceScreen.java
          sed -i 's/import net.minecraft.client.multiplayer.ServerAddress;/import net.minecraft.client.multiplayer.resolver.ServerAddress;/' src/main/java/com/legendfps/WorldInviteService.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/com/legendfps/LegendFpsClient.java")
          s = p.read_text()
          s = s.replace("import net.minecraft.client.gui.components.Button;\\n", "")
          s = s.replace("import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;\\n", "")
          block = """        // Add a LEGEND FPS shortcut to both the main menu and the pause menu.
                  ScreenEvents.AFTER_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      if (screen instanceof TitleScreen || screen instanceof PauseScreen) {
                          int buttonWidth = 112;
                          int x = Math.max(6, screen.width - buttonWidth - 8);
                          int y = screen instanceof TitleScreen ? 8 : Math.max(8, screen.height - 30);

                          Button button = Button.builder(Component.literal("LEGEND FPS"), b ->
                                          client.setScreen(new LegendMenuScreen(screen)))
                                  .bounds(x, y, buttonWidth, 20)
                                  .build();
                          screen.addRenderableWidget(button);
                      }
                  });

          """
          if block not in s:
              raise SystemExit("Could not locate the invalid ScreenEvents block; refusing a partial patch")
          p.write_text(s.replace(block, ""))
          PY
          # Fabric Loom 1.14.10 requires Gradle 9.2.0.
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-9.2.0-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          grep 'distributionUrl=.*gradle-9.2.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
      - name: Build mod
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LEGEND-FPS-build
          path: "**/build/libs/*.jar"
          if-no-files-found: error
